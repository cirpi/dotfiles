font:
  normal:
    family: Blex Mono Nerd Font
    style: Regular
  size: 9
  builtin_box_drawing: true

shell:
  program: /usr/bin/fish

window:
  padding: {x: 8, y: 8}
  dynamic_padding: true


colors:
  primary:
    background: "#1d2b4e"
    foreground: "#825d94"

selection:
  save_to_clipboard: true
